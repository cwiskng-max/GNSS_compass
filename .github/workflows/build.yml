name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
          arduino-cli lib install "GFX Library for Arduino"@1.3.1
          arduino-cli lib install "PCF8574 library"
          arduino-cli lib install "Adafruit CST8XX Library"
          arduino-cli lib install "Adafruit BusIO"

      - name: Compile Firmware
        run: |
          mkdir -p build/gps_compass
          cp gps_compass.ino build/gps_compass/
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            FW_VER="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            FW_VER="v0.2-${HEAD_SHA::7}"
          else
            FW_VER="v0.2-${GITHUB_SHA::7}"
          fi
          sed -i "s/#define FW_VERSION .*/#define FW_VERSION           \"$FW_VER\"/" build/gps_compass/gps_compass.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi --export-binaries build/gps_compass
          cp build/gps_compass/build/esp32.esp32.esp32s3/gps_compass.ino.bin ./gps_compass.ino.esp32s3.bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gps_compass.ino.esp32s3.bin
          path: gps_compass.ino.esp32s3.bin
          if-no-files-found: error

      - name: Create GitHub Release and Attach Binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: gps_compass.ino.esp32s3.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
