name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
      - ui-enhancements
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
          arduino-cli lib install "GFX Library for Arduino"@1.3.1
          arduino-cli lib install "PCF8574 library"
          arduino-cli lib install "Adafruit CST8XX Library"
          arduino-cli lib install "Adafruit BusIO"

      - name: Compile Firmware
        run: |
          mkdir -p build/gps_compass
          cp gps_compass.ino build/gps_compass/
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi --export-binaries build/gps_compass
          cp build/gps_compass/build/esp32.esp32.esp32s3/gps_compass.ino.bin ./gps_compass.ino.esp32s3.bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps_compass.ino.esp32s3.bin
          path: gps_compass.ino.esp32s3.bin
          if-no-files-found: error

      - name: Publish Release (Rolling Latest & Tagged Releases)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Continuous Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: gps_compass.ino.esp32s3.bin
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
